<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dr. Driving</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #fs { position: fixed; top: 6px; right: 6px; z-index: 10; width: 34px; height: 34px; padding: 0;
    border: 0; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; opacity: .4; cursor: pointer;
    display: none; align-items: center; justify-content: center; touch-action: manipulation; }
  #fs:hover, #fs:focus-visible { opacity: 1; }
  #fs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<button id="fs" type="button" title="Fullscreen" aria-label="Toggle fullscreen">
  <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<script>
// ---- 1. start downloading all game assets right away, in parallel with the wasm ----------------
// assets.bin is one file (see web/build.sh); the game polls these counters for its loading screen.
var drBundle = { chunks: [], loaded: 0, total: Number("__ASSET_BYTES__") || 0, state: 0, data: null };
(function () {
  fetch("assets.bin").then(function (res) {
    if (!res.ok || !res.body) throw new Error("assets.bin: HTTP " + res.status);
    // Content-Length is the *compressed* size if the server gzips; our own number is the true one
    if (!drBundle.total) drBundle.total = Number(res.headers.get("content-length")) || 0;
    var reader = res.body.getReader();
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) { drBundle.state = 1; return; }
        drBundle.chunks.push(r.value);
        drBundle.loaded += r.value.length;
        return pump();
      });
    }
    return pump();
  }).catch(function (e) { console.warn("asset bundle failed, falling back to per-file loading", e); drBundle.state = -1; });
})();
</script>
<script src="mq_js_bundle.js"></script>
<script>
// ---- 2. imports the wasm expects: save-game storage + the asset bundle -------------------------
(function () {
  var KEY = "drdriving.save";
  var enc = new TextEncoder();
  miniquad_add_plugin({
    name: "drdriving_web",
    version: "0.2.0",
    register_plugin: function (importObject) {
      var env = importObject.env;
      env.dr_storage_set = function (ptr, len) {
        try {
          localStorage.setItem(KEY, new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len)));
        } catch (e) { console.warn("save failed", e); }
      };
      // returns: 0 = nothing saved, >0 = bytes written, <0 = buffer too small (-needed size)
      env.dr_storage_get = function (ptr, cap) {
        var text = null;
        try { text = localStorage.getItem(KEY); } catch (e) {}
        if (!text) return 0;
        var data = enc.encode(text);
        if (data.length > cap) return -data.length;
        new Uint8Array(wasm_memory.buffer, ptr, data.length).set(data);
        return data.length;
      };
      env.dr_bundle_loaded = function () { return drBundle.loaded; };
      env.dr_bundle_total = function () { return drBundle.total; };
      env.dr_bundle_state = function () { return drBundle.state; };
      // copies the whole finished download into wasm memory at ptr (room for dr_bundle_loaded bytes)
      env.dr_bundle_read = function (ptr) {
        var dst = new Uint8Array(wasm_memory.buffer, ptr, drBundle.loaded), off = 0;
        for (var i = 0; i < drBundle.chunks.length; i++) { dst.set(drBundle.chunks[i], off); off += drBundle.chunks[i].length; }
        drBundle.chunks = [];
        return off;
      };
    }
  });
})();
load("drdriving.wasm");

// ---- 3. fullscreen button (hidden where the browser can't do it, e.g. iPhone Safari) ---------
(function () {
  var btn = document.getElementById("fs");
  var el = document.documentElement;
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  btn.style.display = "flex";
  function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    if (isFs()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var p = req.call(el);
      var lock = function () {
        try { screen.orientation.lock("landscape").catch(function () {}); } catch (err) {}
        document.getElementById("glcanvas").focus();
      };
      if (p && p.then) p.then(lock, function () {}); else lock();
    }
  });
  // don't let the click turn into game input / keep focus on the button (space/enter would re-toggle)
  btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  btn.addEventListener("touchstart", function (e) { e.stopPropagation(); }, { passive: true });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
