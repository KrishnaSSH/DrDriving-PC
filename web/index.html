<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dr. Driving</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #fs { position: fixed; top: 6px; right: 6px; z-index: 10; width: 34px; height: 34px; padding: 0;
    border: 0; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; opacity: .4; cursor: pointer;
    display: none; align-items: center; justify-content: center; touch-action: manipulation; }
  #fs:hover, #fs:focus-visible { opacity: 1; }
  #fs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<button id="fs" type="button" title="Fullscreen" aria-label="Toggle fullscreen">
  <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<script>
// ---- 1. start downloading all game assets right away, in parallel with the wasm ----------------
// assets.bin is one file (see web/build.sh); the game polls these counters for its loading screen.
var drBundle = { chunks: [], loaded: 0, total: Number("__ASSET_BYTES__") || 0, state: 0, data: null };
(function () {
  fetch("assets.bin").then(function (res) {
    if (!res.ok || !res.body) throw new Error("assets.bin: HTTP " + res.status);
    // Content-Length is the *compressed* size if the server gzips; our own number is the true one
    if (!drBundle.total) drBundle.total = Number(res.headers.get("content-length")) || 0;
    var reader = res.body.getReader();
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) { drBundle.state = 1; return; }
        drBundle.chunks.push(r.value);
        drBundle.loaded += r.value.length;
        return pump();
      });
    }
    return pump();
  }).catch(function (e) { console.warn("asset bundle failed, falling back to per-file loading", e); drBundle.state = -1; });
})();
</script>
<script src="mq_js_bundle.js"></script>
<script>
// ---- 2. imports the wasm expects: save-game storage + the asset bundle -------------------------
(function () {
  var KEY = "drdriving.save";
  var enc = new TextEncoder();
  miniquad_add_plugin({
    name: "drdriving_web",
    version: "0.2.0",
    register_plugin: function (importObject) {
      var env = importObject.env;
      env.dr_storage_set = function (ptr, len) {
        try {
          localStorage.setItem(KEY, new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len)));
        } catch (e) { console.warn("save failed", e); }
      };
      // returns: 0 = nothing saved, >0 = bytes written, <0 = buffer too small (-needed size)
      env.dr_storage_get = function (ptr, cap) {
        var text = null;
        try { text = localStorage.getItem(KEY); } catch (e) {}
        if (!text) return 0;
        var data = enc.encode(text);
        if (data.length > cap) return -data.length;
        new Uint8Array(wasm_memory.buffer, ptr, data.length).set(data);
        return data.length;
      };
      // ---- small text preferences (player name, friend channel)
      function text(ptr, len) { return new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len)); }
      env.dr_pref_set = function (kp, kl, vp, vl) {
        try { localStorage.setItem("drdriving.pref." + text(kp, kl), text(vp, vl)); } catch (e) {}
      };
      env.dr_pref_get = function (kp, kl, dst, cap) {
        var v = null;
        try { v = localStorage.getItem("drdriving.pref." + text(kp, kl)); } catch (e) {}
        if (!v) return 0;
        var data = enc.encode(v);
        if (data.length > cap) return 0;
        new Uint8Array(wasm_memory.buffer, dst, data.length).set(data);
        return data.length;
      };
      // ---- multiplayer: the Firebase Realtime Database REST API through fetch
      var http = { next: 1, reqs: {} };
      env.dr_http_db = function (dst, cap) {
        var v = new URLSearchParams(location.search).get("db");
        if (!v) return 0;
        var data = enc.encode(v);
        if (data.length > cap) return 0;
        new Uint8Array(wasm_memory.buffer, dst, data.length).set(data);
        return data.length;
      };
      env.dr_http_start = function (mp, ml, up, ul, bp, bl, hp, hl) {
        var id = http.next++, method = text(mp, ml), url = text(up, ul);
        var r = http.reqs[id] = { state: 0, status: 0, body: new Uint8Array(0), etag: null };
        var init = { method: method, headers: {}, cache: "no-store", keepalive: method === "DELETE" };
        text(hp, hl).split("\n").forEach(function (l) {
          var i = l.indexOf(":");
          if (i > 0) init.headers[l.slice(0, i).trim()] = l.slice(i + 1).trim();
        });
        if (bl > 0) init.body = text(bp, bl);
        function done(res, t) { r.status = res ? res.status : 0; r.etag = res ? res.headers.get("etag") : null; r.body = enc.encode(t || ""); r.state = 1; }
        function go(u, i) {
          return fetch(u, i).then(function (res) { return res.text().then(function (t) { done(res, t); }); });
        }
        go(url, init).catch(function () {
          // a browser or proxy that refuses PATCH: Firebase accepts the override as a query parameter
          if (method !== "PATCH") return done(null, "");
          var init2 = Object.assign({}, init, { method: "POST" });
          return go(url + (url.indexOf("?") < 0 ? "?" : "&") + "x-http-method-override=PATCH", init2).catch(function () { done(null, ""); });
        });
        return id;
      };
      env.dr_http_state = function (id) { return http.reqs[id] ? http.reqs[id].state : 1; };
      env.dr_http_status = function (id) { return http.reqs[id] ? http.reqs[id].status : 0; };
      env.dr_http_body_len = function (id) { return http.reqs[id] ? http.reqs[id].body.length : 0; };
      env.dr_http_body = function (id, dst) { if (http.reqs[id]) new Uint8Array(wasm_memory.buffer, dst, http.reqs[id].body.length).set(http.reqs[id].body); };
      env.dr_http_etag_len = function (id) { return http.reqs[id] && http.reqs[id].etag ? enc.encode(http.reqs[id].etag).length : 0; };
      env.dr_http_etag = function (id, dst) { var d = enc.encode(http.reqs[id].etag); new Uint8Array(wasm_memory.buffer, dst, d.length).set(d); };
      env.dr_http_free = function (id) { delete http.reqs[id]; };
      // ---- text input: the game draws its own field; an invisible <input> laid over it only
      // exists so that phones show their keyboard and the browser handles selection / shortcuts.
      // The game reads the text and selection back every frame.
      var tin = { el: null, state: 0 };
      function tinClose() { if (tin.el) { tin.el.remove(); tin.el = null; } }
      env.dr_text_close = function () { tinClose(); tin.state = 0; };
      env.dr_text_open = function (vp, vl, max, numeric) {
        tinClose();
        tin.state = 0;
        if (!document.getElementById("dr-text-style")) {
          var st = document.createElement("style");
          st.id = "dr-text-style";
          st.textContent = "#dr-text::selection{background:transparent;color:transparent}";
          document.head.appendChild(st);
        }
        var el = document.createElement("input");
        el.id = "dr-text";
        el.type = "text";
        el.value = text(vp, vl);
        el.maxLength = max;
        el.autocomplete = "off"; el.autocapitalize = "off"; el.spellcheck = false;
        if (numeric) { el.inputMode = "numeric"; el.pattern = "[0-9]*"; }
        el.setAttribute("enterkeyhint", "done");
        el.style.cssText = "position:fixed;left:0;top:0;width:10px;height:10px;z-index:30;margin:0;padding:0;border:0;outline:none;background:transparent;color:transparent;caret-color:transparent;font-size:16px;cursor:text;user-select:text;-webkit-user-select:text";
        el.addEventListener("keydown", function (e) {
          e.stopPropagation();
          if (e.key === "Enter") { e.preventDefault(); tin.state = 1; }
          else if (e.key === "Escape") { e.preventDefault(); tin.state = 2; }
        });
        ["keyup", "keypress"].forEach(function (n) { el.addEventListener(n, function (e) { e.stopPropagation(); }); });
        el.addEventListener("touchstart", function (e) { e.stopPropagation(); }, { passive: true });
        document.body.appendChild(el);
        tin.el = el;
        setTimeout(function () { try { el.focus(); el.select(); } catch (e) {} }, 60);
      };
      // lay the input exactly over the game's field (window px)
      env.dr_text_pos = function (l, t, w, h) {
        if (!tin.el) return;
        var s = tin.el.style;
        s.left = l + "px"; s.top = t + "px"; s.width = w + "px"; s.height = h + "px";
      };
      env.dr_text_state = function () { return tin.el ? tin.state : 0; };
      env.dr_text_active = function () { return tin.el ? 1 : 0; };
      env.dr_text_value = function (dst, cap) {
        if (!tin.el) return 0;
        var d = enc.encode(tin.el.value);
        if (d.length > cap) return 0;
        new Uint8Array(wasm_memory.buffer, dst, d.length).set(d);
        return d.length;
      };
      // selection as character counts: which 0 = start, 1 = end, 2 = 1 if the caret is at the start
      env.dr_text_sel = function (which) {
        if (!tin.el) return 0;
        var v = tin.el.value;
        var s = tin.el.selectionStart || 0, e = tin.el.selectionEnd == null ? s : tin.el.selectionEnd;
        if (which === 2) return tin.el.selectionDirection === "backward" ? 1 : 0;
        return Array.from(v.slice(0, which === 0 ? s : e)).length;
      };
      env.dr_text_set = function (vp, vl, start, end) {
        if (!tin.el) return;
        var v = text(vp, vl), c = Array.from(v);
        tin.el.value = v;
        try { tin.el.setSelectionRange(c.slice(0, start).join("").length, c.slice(0, end).join("").length); } catch (e) {}
      };
      env.dr_bundle_loaded = function () { return drBundle.loaded; };
      env.dr_bundle_total = function () { return drBundle.total; };
      env.dr_bundle_state = function () { return drBundle.state; };
      // copies the whole finished download into wasm memory at ptr (room for dr_bundle_loaded bytes)
      env.dr_bundle_read = function (ptr) {
        var dst = new Uint8Array(wasm_memory.buffer, ptr, drBundle.loaded), off = 0;
        for (var i = 0; i < drBundle.chunks.length; i++) { dst.set(drBundle.chunks[i], off); off += drBundle.chunks[i].length; }
        drBundle.chunks = [];
        return off;
      };
    }
  });
})();
load("drdriving.wasm");

// ---- 3. fullscreen button (hidden where the browser can't do it, e.g. iPhone Safari) ---------
(function () {
  var btn = document.getElementById("fs");
  var el = document.documentElement;
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  btn.style.display = "flex";
  function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    if (isFs()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var p = req.call(el);
      var lock = function () {
        try { screen.orientation.lock("landscape").catch(function () {}); } catch (err) {}
        document.getElementById("glcanvas").focus();
      };
      if (p && p.then) p.then(lock, function () {}); else lock();
    }
  });
  // don't let the click turn into game input / keep focus on the button (space/enter would re-toggle)
  btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  btn.addEventListener("touchstart", function (e) { e.stopPropagation(); }, { passive: true });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
